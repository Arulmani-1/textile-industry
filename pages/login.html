<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - STACKLY</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('../images/faq_bg.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            margin: 0;
            padding: 0;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(5px);
            z-index: -1;
        }
        .login-card {
            background-color: #151a28;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin: auto;
        }
        .input-group-custom {
            background-color: #1e2536;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .input-group-custom:focus-within {
            border-color: #fbb315;
        }
        .input-group-custom .form-control, .input-group-custom .form-select {
            background-color: transparent;
            border: none;
            color: #fff;
            padding: 0.9rem 1.2rem;
            box-shadow: none;
            font-size: 0.95rem;
        }
        .input-group-custom .form-control::placeholder {
            color: #8a94a6;
        }
        .input-group-custom .input-group-text {
            background-color: transparent;
            border: none;
            color: #8a94a6;
            padding-right: 1.2rem;
        }
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%238a94a6' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }
        .btn-yellow {
            background-color: #fbb315;
            color: #151a28;
            font-weight: 600;
            border-radius: 6px;
            border: none;
        }
        .btn-yellow:hover {
            background-color: #e5a312;
            color: #151a28;
        }
        .text-yellow {
            color: #fbb315;
        }
        .text-yellow:hover {
            color: #e5a312;
        }
        .form-check-input {
            background-color: transparent;
            border-color: #4a5568;
        }
        .form-check-input:checked {
            background-color: #fbb315;
            border-color: #fbb315;
        }
        .btn-home {
            background-color: #1e2536;
            color: #fff;
            border-radius: 20px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-home:hover {
            background-color: #2a3449;
            color: #fff;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container d-flex justify-content-center my-5">
        <div class="login-card">
            <!-- Logo -->
            <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none">
                    <img src="../images/logo.webp" alt="Stackly Logo" style="height: 55px;">
                </a>
            </div>
            
            <h4 class="text-white text-center fw-bold mb-2">Client Portal</h4>
            <p class="text-center mb-4" style="color: #8a94a6; font-size: 0.9rem;">Sign in to track your project progress</p>
            
            <form id="loginForm">
                <!-- Role Selection -->
                <div class="mb-3 input-group-custom">
                    <select class="form-select text-white" id="roleSelect" aria-label="Select Role" required>
                        <option value="" selected class="text-dark">Select Role</option>
                        <option value="admin" class="text-dark">Admin</option>
                        <option value="user" class="text-dark">User</option>
                    </select>
                </div>

                <!-- Email -->
                <div class="mb-3 input-group-custom d-flex align-items-center">
                    <input type="email" id="loginEmail" class="form-control flex-grow-1" placeholder="Email Address" required>
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                </div>
                
                <!-- Password -->
                <div class="mb-4 input-group-custom d-flex align-items-center">
                    <input type="password" class="form-control flex-grow-1" placeholder="Password" required>
                    <span class="input-group-text"><i class="bi bi-eye-slash"></i></span>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe" style="color: #8a94a6; font-size: 0.85rem;">
                            Remember Me
                        </label>
                    </div>
                    <a href="#" class="text-yellow text-decoration-none" style="font-size: 0.85rem;">Forgot Password?</a>
                </div>
                
                <!-- Sign In Button -->
                <button class="btn btn-yellow w-100 py-3 mb-4" type="submit">Sign In</button>
                
                <!-- Sign Up -->
                <div class="text-center mb-4">
                    <p style="color: #8a94a6; font-size: 0.9rem; margin-bottom: 0;">Don't have an account? <a href="register.html" class="text-yellow text-decoration-none fw-semibold">Sign Up</a></p>
                </div>

                <!-- Go to Home -->
                <div class="text-center mt-2">
                    <a href="../index.html" class="btn btn-home text-decoration-none">
                        <i class="bi bi-house-door-fill me-2"></i> Go to Home
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent standard form submission
            
            const role = document.getElementById('roleSelect').value;
            const email = document.getElementById('loginEmail').value;
            
            if (email) {
                localStorage.setItem('userEmail', email);
                const users = JSON.parse(localStorage.getItem('stackly_users') || '{}');
                if (users[email]) {
                    localStorage.setItem('userName', users[email]);
                } else {
                    localStorage.setItem('userName', email.split('@')[0]);
                }
            }
            
            if (role === 'admin') {
                window.location.href = 'admin_dashboard.html';
            } else if (role === 'user') {
                window.location.href = 'user_dashboard.html';
            } else {
                alert('Please select a valid role before signing in.');
            }
        });
    </script>
</body>
</html>
