<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - STACKLY</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="mb-4" style="font-family: var(--font-number); font-size: 10rem; font-weight: 700; color: transparent; -webkit-text-stroke: 2px var(--accent-gold); letter-spacing: 10px;">
                    404
                </div>

                <a href="../index.html" class="btn btn-premium btn-lg rounded-pill px-5 hover-target">Back to Home</a>

        </div>
